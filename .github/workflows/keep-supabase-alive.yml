name: Mantener Supabase activo

on:
  schedule:
    # Corre cada 3 dias a las 12:00 UTC, bien dentro de la ventana de 7 dias de Supabase
    - cron: "0 12 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a la base de datos de Supabase
        run: |
          curl -sf "${SUPABASE_URL}/rest/v1/insumos?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -o /dev/null -w "Respuesta: %{http_code}\n"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
